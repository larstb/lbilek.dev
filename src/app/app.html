<app-header />
<main>
  @for (section of sections; track section) {
    @switch (section) {
      @case ('about') { <app-hero /> }
      @case ('experience') { <app-experience appReveal sectionId="experience" /> }
      @case ('education') { <app-experience appReveal sectionId="education" /> }
      @case ('skills') { <app-skills appReveal /> }
      @case ('projects') { <app-projects appReveal /> }
      @case ('contact') { <app-contact appReveal /> }
    }
  }
</main>
<app-footer />

@if (showSplash()) {
  @defer (on immediate) {
    <app-welcome-animation (finished)="onSplashFinished()" />
  }
}
